# Not a monorepo. Dependencies still come from the npm registry (see package.json).
# pnpm blocks brand-new publishes for ~24h; allow Solspace Freeform packages immediately.
minimumReleaseAgeExclude:
  - "@solspace/freeform-core@0.1.17"
  - "@solspace/freeform-react@0.1.17"
  - "@solspace/freeform-extensions@0.1.17"
  - "@solspace/freeform-theme-default@0.1.17"
  - "@solspace/freeform-theme-tailwind@0.1.17"
  - "@solspace/freeform-theme-bootstrap@0.1.17"
